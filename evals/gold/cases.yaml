        caveat: "These factors explain the model's risk prediction. They are statistical associations, not confirmed patient needs; confirm needs from the CHW notes."
        top_risk_factors:
          - {"feature": "age", "description": "Age in years", "patient_value": 74, "effect": "raises predicted risk", "use_in_care_plan": true, "note": "Not modifiable."}
          - {"feature": "sumcomorbidities", "description": "Number of chronic conditions", "patient_value": 3, "effect": "raises predicted risk", "use_in_care_plan": true}
          - {"feature": "hypertension", "description": "Has hypertension", "patient_value": "Yes", "effect": "raises predicted risk", "use_in_care_plan": true}
      notes: {status: Error, error: "Notes service timeout."}
    expected:
      required_tools: [prediction_tool, notes_tool]
      # High-priority outreach is acceptable when notes are missing: the study favours recall over
      # precision (a missed readmission costs more than an extra call). Hernandez et al., Sec. 6.
      top_priority_in: [Low, Medium, High]
      must_address:
        - {barrier: outreach, min_priority: Low}
      must_not_address: [transportation, financial, food]

