
# .github/workflows/ci.yml
# Continuous Integration (CI) pipeline.
# Runs on every push to main and every pull request targeting main.

name: VertexCare CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test]"

      # Step 4: Run tests
      - name: Run tests
        run: python -m pytest

      # Step 5: Agent evaluation gate (no API calls)
      - name: Agent eval gate
        if: matrix.python-version == '3.12'
        run: python -m evals.run_eval score --min-pass-rate 0.85

      # Step 6: Publish evaluation report
      - name: Publish eval report
        if: always() && matrix.python-version == '3.12'
        run: cat evals/reports/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
